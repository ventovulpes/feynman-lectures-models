<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="./index.css" rel="stylesheet">
    <title>Fermat's Principle of Least Time</title>
</head>
<body class="m-4">
    <h1>Fermat's Principle of Least Time</h1>
    <div>
        <label for="modelType">Model: </label>
        <select name="modelType" id="modelType">
            <option value="refraction">Refraction</option>
            <option value="sphericalMirror">Spherical Mirror</option>
        </select>
    </div>
    <canvas class="canvas" id="canvas"></canvas>
    <div class="parameters" id="parameters"></div>
    <p>Click and drag to move the points.</p>
    <p>A simulation showing how Snell's Law can be obtained by selecting the ray which requires the least amount of time to reach its destination.</p>
    <label for="graph">Angle θ<sub>a</sub> vs Time Taken</label>
    <canvas class="graph" id="graph"></canvas>
    <script src="./modelTypes.js"></script>
    <script src="./draw.js"></script>
    <script src="./graph.js"></script>
    <script src="./main.js"></script>
    <script src="./parameters.js"></script>
</body>
</html>
